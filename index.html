        const Download = (props) => (

                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />

        const Eye = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />

        );

        const XCircle = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <circle cx="12" cy="12" r="10" />
                <path d="m15 9-6 6" />
                <path d="m9 9 6 6" />
            </svg>
        );

        // Button Component
        const Button = forwardRef(({ className, variant, size, asChild = false, ...props }, ref) => {
            const baseClasses = "inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50";
            const variants = {
                default: "bg-primary text-primary-foreground hover:bg-primary/90",
                destructive: "bg-destructive text-destructive-foreground hover:bg-destructive/90",
                outline: "border border-input bg-background hover:bg-accent hover:text-accent-foreground",
                secondary: "bg-secondary text-secondary-foreground hover:bg-secondary/80",
                ghost: "hover:bg-accent hover:text-accent-foreground",
                link: "text-primary underline-offset-4 hover:underline",
            };
            const sizes = {
                default: "h-10 px-4 py-2",
                sm: "h-9 rounded-md px-3",
                lg: "h-11 rounded-md px-8",
                icon: "h-10 w-10",
            };
            const Comp = asChild ? 'span' : 'button';
            return (
                <Comp
                    className={`${baseClasses} ${variants[variant || 'default']} ${sizes[size || 'default']} ${className || ''}`}
                    ref={ref}
                    {...props}
                />
            );
        });
        Button.displayName = "Button";

        // Input Component
        const Input = forwardRef(({ className, type, ...props }, ref) => {
            return (
                <input
                    type={type}
                    className={`flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 ${className || ''}`}
                    ref={ref}
                    {...props}
                />
            );

        Input.displayName = "Input";

        // Card Components
        const Card = forwardRef(({ className, ...props }, ref) => (

        const Table = forwardRef(({ className, ...props }, ref) => (

        // Progress Component
        const Progress = forwardRef(({ className, value, ...props }, ref) => (

                ref={ref}

        // Main App Component
        const App = () => {
            const [uploadedFiles, setUploadedFiles] = useState([]);
            const [processing, setProcessing] = useState(false);
            const [progress, setProgress] = useState(0);
            const [mergedData, setMergedData] = useState([]);
            const [excelFileName, setExcelFileName] = useState('merged_csv_data.xlsx');
            const [message, setMessage] = useState('Ready to upload files');
            const [showPreview, setShowPreview] = useState(false);
            const [csvDelimiter, setCsvDelimiter] = useState(',');
            const [hasHeaders, setHasHeaders] = useState(true);
            const fileInputRef = useRef(null);

            // Handle file selection via input or drag-and-drop
            const handleFileChange = useCallback((event) => {
                const files = event.target.files ? Array.from(event.target.files) : Array.from(event.dataTransfer.files);
                setUploadedFiles((prevFiles) => {
                    const newFiles = files.filter(file => !prevFiles.some(p => p.name === file.name && p.size === file.size));
                    if (newFiles.length > 0) {
                        setMessage(`Added ${newFiles.length} file(s).`);
                    }
                    return [...prevFiles, ...newFiles];
                });
            }, []);

            // Handle drag over event for drag-and-drop
            const handleDragOver = useCallback((event) => {
                event.preventDefault();
                event.stopPropagation();
                event.dataTransfer.dropEffect = 'copy';
            }, []);

            // Handle file drop event for drag-and-drop
            const handleDrop = useCallback((event) => {
                event.preventDefault();
                event.stopPropagation();
                handleFileChange(event);
            }, [handleFileChange]);

            // Remove a specific file from the uploaded list
            const removeFile = useCallback((fileToRemove) => {
                setUploadedFiles(prevFiles => prevFiles.filter(file => file !== fileToRemove));
                setMessage(`Removed ${fileToRemove.name}.`);
            }, []);

            // Process all uploaded files
            const processFiles = useCallback(async () => {
                if (uploadedFiles.length === 0) {
                    setMessage('Please upload at least one ZIP or GZ file.');
                    return;
                }

                setProcessing(true);
                setProgress(0);
                setMergedData([]);
                setMessage('Starting file processing...');

                let allCsvFiles = [];
                let processedCount = 0;

                try {
                    for (const file of uploadedFiles) {
                        const fileExtension = file.name.split('.').pop().toLowerCase();
                        let extractedFiles = [];

                        if (fileExtension === 'zip') {
                            setMessage(`Unzipping ${file.name}...`);
                            if (typeof JSZip === 'undefined') {
                                throw new Error('JSZip library is not loaded. Please refresh the page.');
                            }
                            const zip = await new JSZip().loadAsync(file);
                            const zipCsvEntries = [];
                            zip.forEach((relativePath, zipEntry) => {
                                if (!zipEntry.dir && relativePath.toLowerCase().endsWith('.csv')) {
                                    zipCsvEntries.push({
                                        name: relativePath,
                                        asyncContent: zipEntry.async('string')
                                    });
                                }
                            });
                            if (zipCsvEntries.length === 0) {
                                setMessage(`Warning: No CSV files found in ${file.name}.`);
                            }
                            extractedFiles = zipCsvEntries;

                        } else if (fileExtension === 'gz') {
                            setMessage(`Decompressing ${file.name}...`);
                            if (typeof pako === 'undefined') {
                                throw new Error('pako library is not loaded. Please refresh the page.');
                            }
                            const compressedData = await file.arrayBuffer();
                            const decompressed = pako.ungzip(new Uint8Array(compressedData), { to: 'string' });
                            if (file.name.toLowerCase().endsWith('.csv.gz') || file.name.toLowerCase().includes('.csv')) {
                                extractedFiles.push({
                                    name: file.name.replace(/\.gz$/, ''),
                                    asyncContent: Promise.resolve(decompressed)
                                });
                            } else {
                                setMessage(`Skipping ${file.name}: GZ files are expected to contain CSV content (e.g., .csv.gz).`);
                            }
                        } else {
                            setMessage(`Skipping ${file.name}: Unsupported file type. Only .zip and .gz are supported.`);
                        }

                        for (const extractedFile of extractedFiles) {
                            const content = await extractedFile.asyncContent;
                            allCsvFiles.push({ filename: extractedFile.name, content: content });
                        }

                        processedCount++;
                        setProgress(Math.round((processedCount / uploadedFiles.length) * 100));
                    }

                    // Sort CSV files by filename
                    allCsvFiles.sort((a, b) => a.filename.localeCompare(b.filename));

                    let combinedData = [];
                    let firstDatasetProcessed = false;
                    let excelHeaders = [];

                    // Merge CSVs and add empty rows
                    for (const csvFile of allCsvFiles) {
                        if (!firstDatasetProcessed && hasHeaders) {
                            // For the very first CSV, if headers are enabled, parse with header: true
                            if (typeof Papa === 'undefined') {
                                throw new Error('PapaParse library (Papa) is not loaded. Please refresh the page.');
                            }
                            const parsed = Papa.parse(csvFile.content, {
                                header: true,
                                skipEmptyLines: true,
                                delimiter: csvDelimiter,
                            });

                            if (parsed.errors.length > 0) {
                                console.warn(`Errors parsing headers in ${csvFile.filename}:`, parsed.errors);
                                setMessage(`Warning: Errors found in ${csvFile.filename} headers. Merging may be incomplete.`);
                            }

                            if (parsed.meta.fields && parsed.meta.fields.length > 0) {
                                excelHeaders = parsed.meta.fields;
                                combinedData.push(excelHeaders);
                            } else {
                                setMessage(`Warning: Could not parse headers from ${csvFile.filename}. Treating as no headers.`);
                                setHasHeaders(false);
                                const fallbackParsed = Papa.parse(csvFile.content, {
                                    header: false,
                                    skipEmptyLines: true,
                                    delimiter: csvDelimiter,
                                });
                                if (fallbackParsed.data.length > 0) {
                                    combinedData = combinedData.concat(fallbackParsed.data);
                                }
                            }
                            if (parsed.data.length > 0) {
                                combinedData = combinedData.concat(parsed.data.map(row => excelHeaders.map(header => row[header])));
                            }
                            firstDatasetProcessed = true;

                        } else {
                            if (!firstDatasetProcessed) {
                                combinedData.push([]);
                                combinedData.push([]);
                            }

                            if (typeof Papa === 'undefined') {
                                throw new Error('PapaParse library (Papa) is not loaded. Please refresh the page.');
                            }
                            const parsed = Papa.parse(csvFile.content, {
                                header: false,
                                skipEmptyLines: true,
                                delimiter: csvDelimiter,
                            });

                            if (parsed.errors.length > 0) {
                                console.warn(`Errors parsing ${csvFile.filename}:`, parsed.errors);
                                setMessage(`Warning: Errors found in ${csvFile.filename}. Merging may be incomplete.`);
                            }

                            let dataToAdd = parsed.data;
                            if (hasHeaders && dataToAdd.length > 0) {
                                dataToAdd = dataToAdd.slice(1);
                            }
                            
                            if (dataToAdd.length > 0) {
                                combinedData = combinedData.concat(dataToAdd);
                            }
                            firstDatasetProcessed = true;
                        }
                    }

                    setMergedData(combinedData);
                    setMessage('All CSV files processed and merged successfully! Ready for preview or download.');
                } catch (error) {
                    setMessage(`Error processing files: ${error.message}. Please try again.`);
                    console.error('Processing error:', error);
                    setMergedData([]);
                } finally {
                    setProcessing(false);
                    setProgress(0);
                }
            }, [uploadedFiles, csvDelimiter, hasHeaders]);

            // Download the merged Excel file
            const downloadExcel = useCallback(() => {
                if (mergedData.length === 0) {
                    setMessage('No data to download. Please process files first.');
                    return;
                }

                if (typeof XLSX === 'undefined') {
                    setMessage('Excel library not loaded. Please refresh the page.');
                    return;
                }

                try {
                    const ws = XLSX.utils.aoa_to_sheet(mergedData);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, 'Merged CSVs');

                    // Convert workbook to binary string
                    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'binary' });

                    // Create a Blob and trigger download
                    const s2ab = (s) => {
                        const buf = new ArrayBuffer(s.length);
                        const view = new Uint8Array(buf);
                        for (let i = 0; i < s.length; i++) view[i] = s.charCodeAt(i) & 0xFF;
                        return buf;
                    };

                    const blob = new Blob([s2ab(wbout)], { type: 'application/octet-stream' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = excelFileName.endsWith('.xlsx') ? excelFileName : `${excelFileName}.xlsx`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    setMessage('Excel file downloaded successfully!');
                } catch (error) {
                    setMessage(`Error downloading Excel file: ${error.message}`);
                    console.error('Download error:', error);
                }
            }, [mergedData, excelFileName]);

            // Clear all uploaded files and processed data
            const clearAll = useCallback(() => {
                setUploadedFiles([]);
                setMergedData([]);
                setProcessing(false);
                setProgress(0);
                setMessage('All data cleared. Ready for new uploads.');
                if (fileInputRef.current) {
                    fileInputRef.current.value = '';
                }
            }, []);

            return (
                <div className="min-h-screen bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 p-4 sm:p-6 lg:p-8 flex items-center justify-center">
                    <div className="w-full max-w-4xl">
                        <Card className="w-full rounded-lg shadow-xl dark:bg-gray-800 border-none">
                            <CardHeader className="text-center p-6">
                                <CardTitle className="text-3xl font-bold text-blue-600 dark:text-blue-400">
                                    CSV Merger & Excel Exporter
                                </CardTitle>
                                <CardDescription className="text-gray-600 dark:text-gray-400 mt-2">
                                    Upload ZIP/GZ files containing CSVs, merge them, and download as Excel.
                                </CardDescription>
                            </CardHeader>
                            <CardContent className="p-6 space-y-6">
                                {/* File Upload Area */}
                                <div
                                    className="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-8 text-center cursor-pointer hover:border-blue-500 dark:hover:border-blue-400 transition-colors"
                                    onDragOver={handleDragOver}
                                    onDrop={handleDrop}
                                    onClick={() => fileInputRef.current?.click()}
                                    role="button"
                                    aria-label="Drag and drop files or click to upload"
                                    tabIndex="0"
                                >
                                    <FileUp className="mx-auto h-12 w-12 text-gray-400 dark:text-gray-500 mb-4" />
                                    <p className="text-lg font-medium text-gray-700 dark:text-gray-300">
                                        Drag & drop your ZIP/GZ files here, or click to select
                                    </p>
                                    <p className="text-sm text-gray-500 dark:text-gray-400 mt-1">
                                        (Supports .zip, .gz containing .csv files)
                                    </p>
                                    <Input
                                        type="file"
                                        multiple
                                        accept=".zip,.gz"
                                        onChange={handleFileChange}
                                        className="hidden"
                                        ref={fileInputRef}
                                        aria-label="Upload ZIP or GZ files"
                                    />
                                </div>

                                {/* Uploaded Files List */}
                                {uploadedFiles.length > 0 && (
                                    <div className="space-y-3" aria-live="polite">
                                        <h3 className="text-xl font-semibold text-gray-800 dark:text-gray-200">Uploaded Files:</h3>
                                        <ul className="list-none p-0 text-gray-700 dark:text-gray-300">
                                            {uploadedFiles.map((file, index) => (
                                                <li key={index} className="flex items-center justify-between py-1 px-3 bg-gray-50 dark:bg-gray-700 rounded-md mb-1">
                                                    <span className="truncate pr-2" title={file.name}>{file.name} ({Math.round(file.size / 1024)} KB)</span>
                                                    <Button
                                                        variant="ghost"
                                                        size="sm"
                                                        onClick={() => removeFile(file)}
                                                        className="text-red-500 hover:text-red-700 dark:text-red-400 dark:hover:text-red-600 p-1"
                                                        aria-label={`Remove file ${file.name}`}
                                                    >
                                                        <XCircle className="h-4 w-4" />
                                                    </Button>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                )}

                                {/* CSV Options */}
                                <div className="flex flex-col sm:flex-row gap-4 items-center">
                                    <div className="flex items-center space-x-2 flex-1">
                                        <input
                                            type="checkbox"
                                            id="hasHeaders"
                                            checked={hasHeaders}
                                            onChange={(e) => setHasHeaders(e.target.checked)}
                                            aria-checked={hasHeaders}
                                            className="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                                        />
                                        <label htmlFor="hasHeaders" className="text-gray-700 dark:text-gray-300 cursor-pointer">
                                            First CSV row contains headers
                                        </label>
                                    </div>
                                    <div className="flex items-center space-x-2 flex-1">
                                        <label htmlFor="csvDelimiter" className="text-gray-700 dark:text-gray-300">
                                            CSV Delimiter:
                                        </label>
                                        <select 
                                            id="csvDelimiter"
                                            value={csvDelimiter} 
                                            onChange={(e) => setCsvDelimiter(e.target.value)}
                                            className="w-[180px] h-10 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        >
                                            <option value=",">Comma (,)</option>
                                            <option value=";">Semicolon (;)</option>
                                            <option value="\t">Tab (\t)</option>
                                            <option value="|">Pipe (|)</option>
                                        </select>
                                    </div>
                                </div>

                                {/* Processing Controls and Progress */}
                                <div className="flex flex-col sm:flex-row gap-4">
                                    <Button
                                        onClick={processFiles}
                                        disabled={uploadedFiles.length === 0 || processing}
                                        className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md shadow-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                                        aria-label={processing ? 'Processing files' : 'Process uploaded files'}
                                    >
                                        {processing ? 'Processing...' : 'Process Files'}
                                    </Button>
                                    <Button
                                        onClick={clearAll}
                                        variant="outline"
                                        className="flex-1 border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-semibold py-2 px-4 rounded-md shadow-md transition-colors"
                                        aria-label="Clear all uploaded files and processed data"
                                    >
                                        Clear All
                                    </Button>
                                </div>

                                {processing && (
                                    <div className="w-full" role="progressbar" aria-valuenow={progress} aria-valuemin="0" aria-valuemax="100">
                                        <Progress value={progress} className="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full" />
                                        <p className="text-center text-sm text-gray-500 dark:text-gray-400 mt-2">{progress}%</p>
                                    </div>
                                )}

                                {/* Messages */}
                                {message && (
                                    <p className={`text-center text-sm font-medium ${message.includes('Error') ? 'text-red-600' : message.includes('Warning') ? 'text-yellow-600' : 'text-green-600'} dark:${message.includes('Error') ? 'text-red-400' : message.includes('Warning') ? 'text-yellow-400' : 'text-green-400'}`}
                                       role="status" aria-live="polite">
                                        {message}
                                    </p>
                                )}

                                {/* Excel File Renaming and Download */}
                                {mergedData.length > 0 && (
                                    <div className="space-y-4">
                                        <h3 className="text-xl font-semibold text-gray-800 dark:text-gray-200">Download Excel:</h3>
                                        <div className="flex flex-col sm:flex-row gap-4 items-center">
                                            <Input
                                                type="text"
                                                value={excelFileName}
                                                onChange={(e) => setExcelFileName(e.target.value)}
                                                placeholder="Enter Excel file name"
                                                className="flex-1 p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-blue-500 focus:border-blue-500"
                                                aria-label="Excel file name"
                                            />
                                            <Button
                                                onClick={downloadExcel}
                                                className="flex-shrink-0 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-md shadow-md transition-colors"
                                                aria-label="Download merged Excel file"
                                            >
                                                <Download className="mr-2 h-4 w-4" /> Download Excel
                                            </Button>
                                            <Button
                                                onClick={() => setShowPreview(true)}
                                                variant="outline"
                                                className="flex-shrink-0 border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-semibold py-2 px-4 rounded-md shadow-md transition-colors"
                                                aria-label="Preview merged data"
                                            >
                                                <Eye className="mr-2 h-4 w-4" /> Preview Data
                                            </Button>
                                        </div>
                                    </div>
                                )}
                            </CardContent>
                        </Card>
                    </div>

                    {/* Preview Modal */}
                    {showPreview && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-4xl w-[95vw] h-[80vh] overflow-hidden">
                                <div className="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-blue-600 dark:text-blue-400">
                                        Data Preview
                                    </h2>
                                    <button 
                                        onClick={() => setShowPreview(false)}
                                        className="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300"
                                        aria-label="Close preview"
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </div>
                                <div className="overflow-auto h-[calc(80vh-60px)] border border-gray-200 dark:border-gray-700 rounded-md" tabIndex="0" role="region" aria-label="Merged data preview table">
                                    {mergedData.length > 0 ? (
                                        <Table className="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                                            <TableHeader className="bg-gray-50 dark:bg-gray-700 sticky top-0 z-10">
                                                <TableRow>
                                                    {mergedData[0] && mergedData[0].map((header, index) => (
                                                        <TableHead key={index} className="px-4 py-2 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                                            {header}
                                                        </TableHead>
                                                    ))}
                                                </TableRow>
                                            </TableHeader>
                                            <TableBody className="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                                                {mergedData.map((row, rowIndex) => (
                                                    <TableRow key={rowIndex} className={
                                                        row.length === 0 ? 'bg-yellow-100 dark:bg-yellow-900 border-y-2 border-yellow-300 dark:border-yellow-700' :
                                                        rowIndex % 2 === 0 ? 'bg-gray-50 dark:bg-gray-800' : 'bg-white dark:bg-gray-900'
                                                    }>
                                                        {row.length === 0 ? (
                                                            <TableCell colSpan={mergedData[0]?.length || 1} className="px-4 py-2 text-center text-sm text-gray-500 dark:text-gray-400 italic">
                                                                (Empty Row)
                                                            </TableCell>
                                                        ) : (
                                                            row.map((cell, cellIndex) => (
                                                                <TableCell key={cellIndex} className="px-4 py-2 whitespace-nowrap text-sm text-gray-900 dark:text-gray-200">
                                                                    {cell}
                                                                </TableCell>
                                                            ))
                                                        )}
                                                    </TableRow>
                                                ))}
                                            </TableBody>
                                        </Table>
                                    ) : (
                                        <p className="p-4 text-center text-gray-500 dark:text-gray-400">No data to preview. Please process files first.</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
